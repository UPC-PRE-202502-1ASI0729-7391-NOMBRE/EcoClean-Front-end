<div class="page-container">
  <div class="card">

    <div class="lang-switch">
      <button>ES</button>
      <button>EN</button>
    </div>

    <h1 class="title">Eco<br><span>Smart</span></h1>
    <p class="subtitle">WASTE SOLUTIONS</p>
    <h2 class="welcome">¡Bienvenido!</h2>

    <label>Email</label>
    <input
      type="email"
      placeholder="example@gmail.com"
      [(ngModel)]="username"
    />

    <p class="error" *ngIf="!username && errorMessage">Ingresa tu correo electrónico.</p>

    <label>Contraseña</label>
    <input
      type="password"
      placeholder="********"
      [(ngModel)]="password"
    />

    <p class="error" *ngIf="!password && errorMessage">Ingresa tu contraseña.</p>

    <button class="btn" (click)="signIn()">Entrar</button>

    <p class="bottom-text">
      ¿No tienes una cuenta? <a href="/sign-up">Crea una cuenta</a>
    </p>

  </div>
</div>
