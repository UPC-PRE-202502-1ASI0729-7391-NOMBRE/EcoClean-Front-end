<div class="profile-header">
  <h1>Mi Perfil</h1>
  <p *ngIf="profile.workingMunicipality" class="employee-badge">
    👷‍♂️ Empleado de {{ profile.workingMunicipality }}
  </p>
  <p *ngIf="!profile.workingMunicipality">Ciudadano</p>
</div>

<div class="profile-container" *ngIf="!loading">

  <div class="photo-section">
    <img [src]="profile.photoUrl || 'https://via.placeholder.com/150'" class="profile-photo"/>
  </div>

  <h3>Datos Personales</h3>
  <div class="form-grid">
    <div class="field">
      <label>Nombre</label>
      <input type="text" [(ngModel)]="profile.firstName">
    </div>
    <div class="field">
      <label>Apellido</label>
      <input type="text" [(ngModel)]="profile.lastName">
    </div>
    <div class="field">
      <label>Correo Electrónico</label>
      <input type="email" [(ngModel)]="profile.email">
    </div>
    <div class="field">
      <label>Distrito de Residencia</label>
      <select [(ngModel)]="profile.district">
        <option *ngFor="let d of districts" [value]="d">{{ d }}</option>
      </select>
    </div>
  </div>

  <div *ngIf="profile.workingMunicipality" class="work-section">
    <h3>Datos Laborales</h3>
    <div class="field">
      <label>Municipalidad donde trabaja</label>
      <input type="text" [value]="profile.workingMunicipality" disabled class="disabled-input">
      <small>Este dato solo puede ser modificado por el administrador.</small>
    </div>
  </div>

  <h3>Seguridad</h3>
  <div class="field">
    <label>Nueva Contraseña (Opcional)</label>
    <input type="password" [(ngModel)]="newPassword" placeholder="Dejar en blanco para mantener la actual">
  </div>

  <button class="save-btn" (click)="saveProfile()" [disabled]="saving">
    Guardar Cambios
  </button>
</div>
