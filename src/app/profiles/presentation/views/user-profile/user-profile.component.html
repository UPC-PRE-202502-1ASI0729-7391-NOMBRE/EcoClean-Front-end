<div class="profile-header">
  <h1>Tu perfil</h1>
  <p>Administra tu información personal y mantén tus datos actualizados.</p>
</div>

<div class="profile-container" *ngIf="!loading">

  <div class="photo-section">
    <img [src]="profile.photoUrl || defaultPhoto" class="profile-photo"/>

    <button class="upload-btn" (click)="triggerImageUpload()">
      Cambiar foto
    </button>

    <input
      id="photoInput"
      type="file"
      accept="image/*"
      hidden
      (change)="onImageSelected($event)"
    />
  </div>

  <div class="form-row">
    <div class="field">
      <label>Nombre</label>
      <input type="text" [(ngModel)]="profile.firstName" placeholder="Tu nombre">
    </div>

    <div class="field">
      <label>Apellido</label>
      <input type="text" [(ngModel)]="profile.lastName" placeholder="Tu apellido">
    </div>
  </div>

  <div class="form-row">
    <div class="field">
      <label>E-mail</label>
      <input type="email" [(ngModel)]="profile.email" placeholder="ejemplo@gmail.com">
    </div>

    <div class="field">
      <label>Distrito</label>
      <select [(ngModel)]="profile.district">
        <option *ngFor="let d of districts" [value]="d">{{ d }}</option>
      </select>
    </div>
  </div>

  <button class="save-btn" (click)="saveProfile()" [disabled]="saving">
    {{ saving ? 'Guardando...' : 'Guardar cambios' }}
  </button>

</div>

<div *ngIf="loading" class="loading-box">
  Cargando perfil...
</div>
