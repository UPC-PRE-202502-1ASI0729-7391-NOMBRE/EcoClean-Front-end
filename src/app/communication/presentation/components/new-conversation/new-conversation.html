<div class="modal-backdrop" (click)="close.emit()"></div>

<div class="modal-container">
  <form class="modal-card" (ngSubmit)="submitForm()">
    <h2>Nueva conversación</h2>

    <div class="field-group">
      <label for="municipality">Municipalidad</label>
      <select id="municipality" [(ngModel)]="selectedMunicipality" name="municipality" required>
        <option value="" disabled selected>Selecciona una municipalidad</option>
        <option *ngFor="let m of municipalities" [value]="m.code">
          {{ m.municipalityName }}
        </option>
      </select>
    </div>

    <div class="field-group">
      <label for="message">Mensaje inicial</label>
      <textarea
        id="message"
        [(ngModel)]="message"
        name="message"
        rows="4"
        placeholder="Escribe tu mensaje..."
        required
      ></textarea>
    </div>

    <div class="actions">
      <button type="button" class="cancel" (click)="close.emit()">Cancelar</button>
      <button type="submit" class="send">Enviar</button>
    </div>
  </form>
</div>
