<h1>Reportes de Ciudadanos</h1>

<div *ngIf="loading" class="loading">Cargando reportes...</div>

<div *ngIf="!loading && reports.length === 0" class="empty">
  No hay reportes por mostrar.
</div>

<div class="card" *ngFor="let r of reports">
  <h3>📍 Distrito: {{ r.district }}</h3>

  <p><strong>Mensaje:</strong> {{ r.message }}</p>
  <p><strong>ID del tacho:</strong> {{ r.smartBinId }}</p>
  <p><strong>ID del usuario:</strong> {{ r.reporterId }}</p>

  <p class="date">{{ r.createdAt | date : 'medium' }}</p>

  <div *ngIf="r.photoUrl">
    <img [src]="r.photoUrl" alt="Foto reporte" class="photo">
  </div>

  <span class="status">{{ r.status }}</span>
</div>
