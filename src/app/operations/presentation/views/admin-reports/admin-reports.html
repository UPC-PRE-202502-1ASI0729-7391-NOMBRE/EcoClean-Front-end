<h1>Reportes de Tachos</h1>

<div *ngIf="loading" class="loading">Cargando reportes...</div>

<div *ngIf="!loading && reports.length === 0" class="empty">
  No hay reportes por mostrar.
</div>

<div class="card" *ngFor="let r of reports">
  <div class="card-header">
    <h3>🗑 {{ r.smartBinName }}</h3>
    <span class="district-badge">{{ r.district }}</span>
  </div>

  <p class="reporter">
    <strong>Reportado por:</strong> {{ r.reporterName }}
  </p>

  <p class="message">
    "{{ r.message }}"
  </p>

  <p class="date">{{ r.createdAt | date : 'medium' }}</p>

  <div *ngIf="r.photoUrl" class="photo-container">
    <img [src]="r.photoUrl" alt="Foto reporte" class="photo">
  </div>

  <div class="actions">
    <span class="status">{{ r.status }}</span>

    <button class="dispatch-btn" (click)="dispatchTruck(r.district)">
      REPORTE DE TACHO LLENO
    </button>
  </div>
</div>
