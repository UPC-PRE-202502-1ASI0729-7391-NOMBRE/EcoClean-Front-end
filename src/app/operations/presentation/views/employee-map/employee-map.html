<div class="page-header">
  <h1>Panel de Operaciones - {{ employeeDistrict }}</h1>
  <p>Visualiza el estado de tachos y reportes ciudadanos.</p>
</div>

<div class="map-container">

  <div id="map" class="map-box"></div>

  <button class="dispatch-btn" (click)="dispatchTruck()">
    🚛 Despachar camión al distrito
  </button>

  <h3 class="reports-title">Reportes ciudadanos</h3>

  <div *ngIf="loadingReports" class="loading-box">
    Cargando reportes...
  </div>

  <div *ngIf="!loadingReports && reports.length === 0" class="empty-box">
    No hay reportes en tu distrito.
  </div>

  <div class="report-card" *ngFor="let r of reports">
    <div class="left">
      <div class="avatar">{{ r.smartBinName.charAt(0) }}</div>

      <div class="info">
        <h4>{{ r.smartBinName }}</h4>
        <p>{{ r.message }}</p>
        <p class="date">📅 {{ r.createdAt | date:'medium' }}</p>
      </div>
    </div>
  </div>

</div>
